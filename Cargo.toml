[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/grin-wallet-rpc",
    "crates/janus",
    "crates/messenger",
    "crates/runtime",
    "crates/slint-ui",
    "crates/transfer-contract",
]
exclude = ["third_party/grin-wallet", "third_party/grin-wallet/grin"]

[workspace.package]
version = "0.1.69"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
zeroize = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Mimblewimble: один закреплённый fork для embedded и управляемого RPC.
# grin-wallet: 11046cd197f8296e6cd9313502a9f2cbce6e262a.
# grin submodule: dbaff34f7751ee23316fbbfe5806b47c546776ca.
grin_wallet_libwallet = { path = "third_party/grin-wallet/libwallet", version = "=5.5.1" }
grin_wallet_api = { path = "third_party/grin-wallet/api", version = "=5.5.1" }
grin_wallet_impls = { path = "third_party/grin-wallet/impls", version = "=5.5.1" }
grin_wallet_config = { path = "third_party/grin-wallet/config", version = "=5.5.1" }
grin_wallet_util = { path = "third_party/grin-wallet/util", version = "=5.5.1" }
bech32 = "0.7"
# Phase 3: memory-hard KDF for the seed envelope (upstream grin-wallet uses
# PBKDF2-100, which is not a key-stretching function in any meaningful sense).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = "0.10"
sha3 = "0.10"
data-encoding = "2"
ed25519-dalek = "2"
# Messenger M1: ECIES over the slatepack ed25519 key and AEAD envelope.
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.9"
chacha20 = "0.8"
hkdf = "0.12"
getrandom = "0.2"
base64 = "0.13"
# Nostr transport (NIP-44/NIP-59): BIP-340 Schnorr signatures and x-only ECDH.
secp256k1 = { version = "0.33", features = ["rand"] }
hmac = "0.12"
# Nostr relay: blocking WebSocket client with rustls and webpki roots.
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# rustls needs an explicit provider for the blocking WebSocket client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
grin_core = { path = "third_party/grin-wallet/grin/core", version = "=5.5.2" }
grin_keychain = { path = "third_party/grin-wallet/grin/keychain", version = "=5.5.2" }
grin_util = { path = "third_party/grin-wallet/grin/util", version = "=5.5.2" }

# Desktop shell: Slint. Exact pin: 1.18.1 requires Rust 1.92.
slint = { version = "=1.18.1" }
slint-build = { version = "=1.18.1" }

[profile.dev]
# Grin pulls in heavy crypto; keep dev builds usable but not glacial.
opt-level = 0
# No C debug info: MSVC's -Z7 chokes on long paths in this workspace.
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true





