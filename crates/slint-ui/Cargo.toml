[package]
name = "flint-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Flint Slint UI transition spike"

[dependencies]
slint = { workspace = true }
flint-core = { path = "../core" }
flint-runtime = { path = "../runtime" }
flint-transfer-contract = { path = "../transfer-contract" }
arboard = { version = "3.7", default-features = false }
qrcode = { version = "0.14", default-features = false }
zeroize = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[[bin]]
name = "flint-slint"
path = "src/main.rs"
